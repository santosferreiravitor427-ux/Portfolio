name: Publicar portfolio
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar os arquivos do repositorio
        uses: actions/checkout@v4
      - name: Preparar o portfolio
        run: |
          mkdir -p _site
          unzip -q portfolio-vitor-github.zip -d _site
          test -f _site/index.html
          test -f _site/certificados.html
      - name: Preparar a publicacao
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
