name: Publicar portfólio e projetos
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Montar site
        run: |
          mkdir _site
          unzip -q portfolio-vitor-github.zip -d _site
          cp -a site/. _site/
          cat site-archives/negocios.zip.part* > /tmp/projetos-negocios.zip
          unzip -q /tmp/projetos-negocios.zip -d _site
          test -f _site/index.html
          test -f _site/certificados.html
          test -f _site/projects/neycar/index.html
          test -f _site/projects/casa/index.html
          test -f _site/projects/gcm/index.html
          test -f _site/projects/quadra/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
